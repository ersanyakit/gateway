vision: "Gateway will become a serious crypto currency wallet provider and payment gateway platform built around one shared money core for merchant payments and wallet-provider infrastructure."
positioning: "Gateway is a B2B crypto payment gateway and wallet-provider infrastructure platform for merchant/dealer teams, payment integration developers, and small/mid wallet or exchange platforms, differentiated by one shared money core across payment lifecycle, static wallet, ledger, webhook, reconciliation, and admin recovery."
business_model: "B2B infrastructure platform. Paying customers are merchant/dealer tenants and wallet/exchange platform tenants; checkout payers and wallet end users are downstream users."
business_customers: "Controlled-beta merchant/dealer tenants and small/mid wallet or exchange platform tenants. External buyer/champion/user roles are designed for, but first onboarding and commercial decisions are founder-led by ersan."
