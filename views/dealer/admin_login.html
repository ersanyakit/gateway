<section class="grid min-h-[calc(100vh-184px)] items-center gap-8 lg:grid-cols-[minmax(0,1fr)_430px]">
  <div class="grid max-w-2xl gap-5">
    <span class="inline-flex w-fit rounded-full bg-[#fff3fc] px-3 py-2 text-xs font-extrabold uppercase tracking-[0.08em] text-accentHover">Admin operations</span>
    <h1 class="m-0 text-5xl font-black leading-[0.96] text-ink sm:text-6xl">Çekim onayları kontrollü operasyon akışında.</h1>
    <p class="m-0 max-w-xl text-base leading-8 text-muted">Bayi çekim talepleri admin onayı olmadan gerçek transfer olarak gönderilmez.</p>
  </div>

  <section class="grid gap-4 rounded-[28px] border border-line bg-white/90 p-5 shadow-soft" aria-labelledby="admin-login-title">
    <div>
      <h2 class="m-0 text-2xl font-black text-ink" id="admin-login-title">Admin girişi</h2>
      <p class="m-0 mt-2 text-sm leading-6 text-muted">Yetkili operasyon hesabı ile giriş yap.</p>
    </div>

    {{if .Success}}<div class="rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-bold text-emerald-700">{{.Success}}</div>{{end}}
    {{if .Error}}<div class="rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-bold text-red-700">{{.Error}}</div>{{end}}

    <form class="grid gap-3" method="post" action="/admin/login">
      <label class="grid gap-2 text-sm font-bold text-muted" for="email">E-posta
        <input class="min-h-12 rounded-2xl border border-line bg-white px-4 text-sm font-semibold text-ink outline-none focus:border-accent focus:ring-4 focus:ring-pink-100" id="email" name="email" type="email" autocomplete="email" required>
      </label>
      <label class="grid gap-2 text-sm font-bold text-muted" for="password">Şifre
        <input class="min-h-12 rounded-2xl border border-line bg-white px-4 text-sm font-semibold text-ink outline-none focus:border-accent focus:ring-4 focus:ring-pink-100" id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="inline-flex min-h-12 items-center justify-center rounded-full bg-accent px-5 text-sm font-extrabold text-white shadow-glow hover:bg-accentHover" type="submit">Admin girişi</button>
    </form>
  </section>
</section>
