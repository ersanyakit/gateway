<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} | Gateway Üye İşyeri Portalı</title>
  <link rel="stylesheet" href="/assets/tailwind.css">
  {{if .AdminPanel}}<link rel="stylesheet" href="/assets/admin.css">{{end}}
  <script src="/assets/dashboard.js" defer></script>
</head>
<body class="min-h-screen bg-[#f8f8fa] text-ink antialiased">
  <div class="grid min-h-screen grid-rows-[auto_1fr_auto] bg-[radial-gradient(circle_at_50%_-15%,rgba(239,45,181,0.08),transparent_34%),linear-gradient(180deg,#ffffff_0%,#f8f8fa_56%,#ffffff_100%)]">
    {{template "dealer/partials/header" .}}
    <main class="py-8 sm:py-10 lg:py-12">
      <div class="mx-auto w-full max-w-[1180px] px-4">
        {{embed}}
      </div>
    </main>
    {{template "dealer/partials/footer" .}}
  </div>
</body>
</html>
