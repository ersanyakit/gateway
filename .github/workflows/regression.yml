name: Regression

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  native-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache: true

      - name: Initialize submodules
        run: git submodule update --init --recursive third_party/trustwallet/wallet-core

      - name: Run native Trust Wallet Core regression
        run: GATEWAY_REGRESSION_MODE=native scripts/regression.sh

  fallback-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache: true

      - name: Run fallback regression
        run: GATEWAY_REGRESSION_MODE=fallback scripts/regression.sh
